{% extends "layout.html" %}

{% block content %}
<h2>Kirjaudu</h2>
<form method="POST">
    <p>Käyttäjätunnus: <input type="text" name="username" required></p>
    <p>Salasana: <input type="password" name="password" required></p>
    <button type="submit">Kirjaudu</button>
</form>
<p><a href="{{ url_for('register') }}">Eikö sinulla ole tunnusta? Rekisteröidy</a></p>
{% endblock %}
