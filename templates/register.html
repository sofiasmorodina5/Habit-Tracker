{% block content %}
<h2>Rekisteröidy</h2>

<form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <p>
        <label>Käyttäjätunnus:</label>
        <input type="text" name="username" value="{{ username or '' }}" required maxlength="30">    </p>
    <p>
        <label>Salasana:</label>
        <input type="password" name="password" required maxlength="30">   
    </p>
    <button type="submit">Luo tunnus</button>
</form>

<p><a href="{{ url_for('login') }}">Onko sinulla jo tunnus? Kirjaudu</a></p>
{% endblock %}
