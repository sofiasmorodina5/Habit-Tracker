{% extends "layout.html" %}

{% block content %}
<h2>Muokkaa tapaa</h2>

<form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <p>
        <label>Otsikko:</label>
        <input type="text" name="title" value="{{ habit.title }}" required>
    </p>
    <p>
        <label>Kuvaus:</label>
        <textarea name="description">{{ habit.description }}</textarea>
    </p>
    <p><strong>Luokittelut:</strong></p>
    {% for category in categories %}
        <label>
            <input type="checkbox" name="categories" value="{{ category.name }}" {% if category.name in selected_categories %}checked{% endif %}>
            {{ category.name }}
        </label><br>
    {% endfor %}
    <br><br>
    <button type="submit">Tallenna</button>
</form>
{% endblock %}
