{% extends "layout.html" %}

{% block content %}
<h2>Lisää uusi tapa</h2>
<form method="POST">
    <p>Otsikko: <input type="text" name="title" required></p>
    <p>Kuvaus: <textarea name="description"></textarea></p>

    <p><strong>Viikonpäivät</strong> (valitse ne, joina aiot suorittaa):</p>
    {% for day in ["maanantai", "tiistai", "keskiviikko", "torstai", "perjantai", "lauantai", "sunnuntai"] %}
        <label>
            <input type="checkbox" name="weekday" value="{{ day }}">
            {{ day }}
        </label><br>
    {% endfor %}

    <p><strong>Toistuvuus</strong>:</p>
    <select name="frequency">
        <option value="">Ei valintaa</option>
        <option value="daily">Päivittäin</option>
        <option value="weekly">Viikoittain</option>
        <option value="monthly">Kuukausittain</option>
    </select>

    <br><br>
    <button type="submit">Lisää</button>
</form>
{% endblock %}
